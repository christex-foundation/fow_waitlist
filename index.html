<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="manifest" href="/manifest.json" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#1C1C1C" />

    <!-- TODO: swap for the custom domain before launch (used by canonical, og:url, sitemap.xml). -->
    <link rel="canonical" href="https://fow-waitlist.vercel.app/" />
    <meta name="robots" content="index, follow" />

    <!-- Fonts: Geist (UI/display) + Instrument Serif (italic accent) -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700;800;900&family=Instrument+Serif:ital@0;1&display=swap"
      rel="stylesheet"
    />

    <title>Future of Work — a freelance marketplace built in Africa</title>
    <meta
      name="description"
      content="Future of Work is a freelance marketplace built in Africa for the world. Set your own rates, get paid reliably in your local currency or USD, and build a name that travels. Join the waitlist."
    />

    <!-- Open Graph / social sharing -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Future of Work" />
    <meta property="og:url" content="https://fow-waitlist.vercel.app/" />
    <meta property="og:title" content="Future of Work — a freelance marketplace built in Africa" />
    <meta
      property="og:description"
      content="Set your own rates, get paid reliably in your local currency or USD, and build a name that travels. A freelance marketplace built in Africa — join the waitlist."
    />
    <meta property="og:locale" content="en" />
    <meta property="og:image" content="https://fow-waitlist.vercel.app/og-image.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta
      property="og:image:alt"
      content="Future of Work — freelance work, built in Africa, made for the world."
    />

    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Future of Work — a freelance marketplace built in Africa" />
    <meta
      name="twitter:description"
      content="Set your own rates, get paid reliably in your local currency or USD, and build a name that travels. A freelance marketplace built in Africa — join the waitlist."
    />
    <meta name="twitter:image" content="https://fow-waitlist.vercel.app/og-image.png" />
    <meta
      name="twitter:image:alt"
      content="Future of Work — freelance work, built in Africa, made for the world."
    />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
